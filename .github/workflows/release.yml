# Builds the Windows installer on every version tag (v1.0.0, …) and attaches
# it to a GitHub release. Run it by hand from the Actions tab to just build.
#
# Signing: free for open-source projects through SignPath Foundation; setup
# steps are in docs/SIGNING.md. Once these exist, builds are signed:
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID
# Without them the build still works, unsigned. Tags use the release-signing
# policy (each request is approved in SignPath); runs by hand use test-signing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      POLICY: ${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'test-signing' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Version
        id: ver
        run: echo "version=$(python packaging/build.py --print-version)" >> $env:GITHUB_OUTPUT

      - name: Build the app
        run: python packaging/build.py --app-only

      # ---- sign PC Remote.exe (SignPath artifact configuration "app") ----
      - name: Upload the app for signing
        if: env.SIGN == 'true'
        id: app
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/PC Remote/PC Remote.exe
      - name: Sign the app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: pc-remote
          signing-policy-slug: ${{ env.POLICY }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.app.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.ver.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600  # (release signing waits for approval)
          output-artifact-directory: signed-app
      - name: Use the signed app
        if: env.SIGN == 'true'
        run: Copy-Item "signed-app/PC Remote.exe" "dist/PC Remote/PC Remote.exe" -Force

      - name: Build the installer
        run: python packaging/build.py --installer-only

      # ---- sign the installer (SignPath artifact configuration "installer") ----
      - name: Upload the installer
        id: setup
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/PC-Remote-Setup-*.exe
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: pc-remote
          signing-policy-slug: ${{ env.POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.ver.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup
      - name: Use the signed installer
        if: env.SIGN == 'true'
        run: Copy-Item "signed-setup/*.exe" dist/ -Force

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PC-Remote-Setup-*.exe
          generate_release_notes: true
